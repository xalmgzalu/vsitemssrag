[project]
name = "vsitemssrag"
version = "0.1.0"
description = "RAG-помощник по инвентарю для настольного тенниса VistaSport"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
]

[project.scripts]
vsitemssrag = "vsitemssrag.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
